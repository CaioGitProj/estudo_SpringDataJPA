<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.tymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        /* Apenas um leve gradiente para o fundo não ficar totalmente branco */
        body {
            background: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
        }

        /* Arredondamento um pouco mais suave para o card */
        .card-login {
            border-radius: 15px;
        }
    </style>
</head>

<body class="d-flex align-items-center py-4 bg-light vh-100">
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5 col-xl-4">

                <div class="card card-login border-0 shadow-lg">
                    <div class="card-body p-5">

                        <div class="text-center mb-4">
                            <i class="bi bi-person-circle display-4 text-primary"></i>
                            <h2 class="fw-bold mt-2">Entrar</h2>
                            <p class="text-muted">Acesse sua conta para continuar</p>
                        </div>

                        <form method="POST" th:action="@{/login}">

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="username" name="username" placeholder="Digite seu usuário" required>
                                <label for="username">Username</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="password" name="password" placeholder="Senha" required>
                                <label for="password">Senha</label>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="remember-me" id="rememberMe">
                                    <label class="form-check-label text-muted" for="rememberMe">
                                        Lembrar-me
                                    </label>
                                </div>
                            </div>

                            <button class="btn btn-primary w-100 py-2 mb-3" type="submit">
                                Fazer Login
                            </button>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
